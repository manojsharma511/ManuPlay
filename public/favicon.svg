<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#8a2be2" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="100%" stop-color="#ffaa00" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield/Hexagon -->
  <rect width="512" height="512" rx="112" fill="#0a0c14" />
  <rect x="24" y="24" width="464" height="464" rx="88" fill="#121524" stroke="url(#grad1)" stroke-width="8" />

  <!-- M Shape + Play Triangle -->
  <g filter="url(#glow)">
    <!-- Stylized M -->
    <path d="M 120 370 L 120 150 L 210 270 L 256 200 L 302 270 L 392 150 L 392 370" fill="none" stroke="url(#grad1)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Play Bolt/Triangle in center -->
    <polygon points="230,230 310,280 230,330" fill="url(#grad2)" />
  </g>
</svg>